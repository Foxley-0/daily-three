<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>每日三件事 · 网页预览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #e9f7f1 0%, #f2f6f6 150px, #f4f6f8 100%) fixed;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 28px 16px 170px; }

  /* 各级页面的进入过渡（类名用 dir- 前缀，别和返回按钮的 nav-back 撞车） */
  .screen.dir-forward { animation: navIn .32s cubic-bezier(.22,1,.36,1) both; }
  .screen.dir-back { animation: navBack .32s cubic-bezier(.22,1,.36,1) both; }
  @keyframes navIn { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes navBack { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: translateX(0); } }
  .banner {
    margin-bottom: 22px; padding: 12px 14px;
    background: #eef4ff; border: 1px solid #d6e3fb; border-radius: 10px;
    font-size: 12px; color: #4a6fa5; line-height: 1.6;
  }

  .head { padding: 0 4px 22px; }
  .date { font-size: 28px; font-weight: 600; letter-spacing: 0.5px; }
  .weekday { margin-top: 4px; font-size: 13px; color: #8a8f99; }

  .card { position: relative; overflow: hidden; background: #fff; border-radius: 12px; padding: 18px 16px 16px; }
  .rest-banner { display: flex; align-items: center; margin-bottom: 12px; padding: 7px 10px; border-radius: 8px; background: #eef4ff; }
  .rest-dot { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: #185fa5; margin-right: 7px; }
  .rest-text { font-size: 12px; color: #4a6fa5; }

  /* 卡片统一投影，让层次比纯平底清楚一点 */
  .card, .task, .stat-card, .ach-card, .rec, .form-card, .cal-card { box-shadow: 0 2px 12px rgba(31, 45, 61, .05); }

  /* ---------- 二级页的返回栏 ---------- */
  .navbar {
    display: flex; align-items: center; margin-bottom: 14px; padding: 4px 6px;
    background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(31, 45, 61, .05);
  }
  .nav-back {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s;
  }
  .nav-back:hover { background: rgba(31, 45, 61, .06); }
  .nav-arrow {
    width: 10px; height: 10px; margin-left: 4px;
    border-left: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a;
    border-radius: 1px; transform: rotate(45deg);
  }
  .nav-title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
  .nav-ghost { visibility: hidden; }

  /* ---------- 月历 ---------- */
  .cal-card { background: #fff; border-radius: 14px; padding: 16px 12px 12px; }
  .cal-head { display: flex; align-items: center; padding: 0 4px 10px; }
  .cal-title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .cal-nav {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #8a8f99; line-height: 1; cursor: pointer; user-select: none;
    transition: background .15s, color .15s;
  }
  .cal-nav:hover { background: #f2f3f5; color: #1a1a1a; }
  .cal-week { display: flex; padding-bottom: 4px; }
  .cal-week-cell { width: 14.2857%; text-align: center; font-size: 11px; color: #b6bac1; }
  .cal-grid { display: flex; flex-wrap: wrap; }
  .cal-cell { width: 14.2857%; height: 46px; display: flex; align-items: center; justify-content: center; }
  /* 上/下月补的空位，不参与点击 */
  .cal-cell.is-blank { pointer-events: none; }
  .cal-day {
    width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #1a1a1a; transition: background .15s, box-shadow .15s;
  }
  .cal-cell[data-act]:not(.is-blank) { cursor: pointer; }
  .cal-cell.is-selected .cal-day { background: #e7f7ee; }
  .cal-cell.kind-builtin .cal-day { background: #e6f1fb; color: #185fa5; font-weight: 500; }
  .cal-cell.kind-custom .cal-day { background: #faeeda; color: #854f0b; font-weight: 500; }
  .cal-cell.is-past.kind-normal .cal-day { color: #c9ccd2; }
  .cal-cell.is-today .cal-day { box-shadow: 0 0 0 1.5px #07c160; color: #07a552; font-weight: 600; }
  .cal-cell.is-today.kind-builtin .cal-day { color: #185fa5; }
  .cal-cell.is-today.kind-custom .cal-day { color: #854f0b; }
  .cal-legend { display: flex; justify-content: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f2f3f5; }
  .lg { display: flex; align-items: center; margin: 0 9px; }
  .lg-dot { width: 8px; height: 8px; border-radius: 3px; margin-right: 5px; }
  .lg-builtin { background: #e6f1fb; border: 1px solid #b5d4f4; }
  .lg-custom { background: #faeeda; border: 1px solid #efc98b; }
  .lg-today { background: #fff; border: 1.5px solid #07c160; }
  .lg-text { font-size: 11px; color: #8a8f99; }
  .cal-note { margin-top: 9px; font-size: 11px; line-height: 1.6; color: #a9aeb6; text-align: center; }

  /* ---------- 深夜提示 ---------- */
  .late-night {
    display: inline-block; margin-top: 9px; padding: 5px 10px; border-radius: 50px;
    background: #eef4ff; font-size: 11px; color: #4a6fa5;
  }

  /* ---------- 设置页 ---------- */
  .acct {
    display: flex; align-items: center; padding: 12px 0;
    border-bottom: 1px solid #f2f3f5; cursor: pointer; transition: opacity .15s;
  }
  .acct:last-child { border-bottom: none; }
  /* 添加账号那一行，和上面的账号列表拉开一点 */
  .acct-add { margin-top: 3px; }
  .acct:hover { opacity: .6; }
  .acct-on .acct-name { color: #07a552; }
  .avatar {
    width: 36px; height: 36px; flex-shrink: 0; margin-right: 11px; border-radius: 50%;
    background: #07c160; color: #fff; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-add { background: #eef0f3; color: #8a8f99; font-size: 17px; font-weight: 400; }
  .acct-main { flex: 1; min-width: 0; }
  .acct-name { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-name-add { color: #576b95; }
  .acct-sub { margin-top: 3px; font-size: 11px; color: #a9aeb6; }
  .acct-badge {
    margin-left: 6px; padding: 2px 7px; border-radius: 50px;
    background: #e7f7ee; color: #07a552; font-size: 10px; vertical-align: middle;
  }
  .acct-del {
    flex-shrink: 0; margin-left: 8px; padding: 5px 11px; border-radius: 50px;
    background: #f7f8fa; font-size: 11.5px; color: #a9aeb6; transition: color .15s, background .15s;
  }
  .acct-del:hover { color: #e64340; background: #fdeceb; }

  .group-title { margin: 18px 4px 7px; font-size: 12.5px; color: #8a8f99; }
  .group-note { margin: 7px 4px 0; font-size: 11px; line-height: 1.65; color: #a9aeb6; }

  .card.pad-0 { padding: 0 16px; }
  .row { display: flex; align-items: center; height: 55px; border-bottom: 1px solid #f2f3f5; position: relative; }
  .row:last-child { border-bottom: none; }
  .row[data-act] { cursor: pointer; transition: opacity .15s; }
  .row[data-act]:hover { opacity: .55; }
  .row-ic { position: relative; width: 28px; height: 28px; flex-shrink: 0; margin-right: 11px; border-radius: 8px; }
  .ic-clock { background: #f0a020; }
  .ic-list { background: #07c160; }
  .ic-card { background: #7f77dd; }
  .ic-cal { background: #378add; }
  .ic-bell { background: #e64340; }
  .s-bell {
    position: absolute; left: 50%; top: 50%; width: 11px; height: 10px;
    margin: -8px 0 0 -5.5px; border-radius: 5.5px 5.5px 1px 1px; background: #fff;
  }
  .s-bell-base {
    position: absolute; left: 50%; top: 50%; width: 15px; height: 2px;
    margin: 3px 0 0 -7.5px; border-radius: 1px; background: #fff;
  }
  .s-bell-dot {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
    margin: 6px 0 0 -2px; border-radius: 50%; background: #fff;
  }
  .row-title { flex: 1; min-width: 0; font-size: 15px; }
  .row-value { flex-shrink: 0; font-size: 14px; color: #8a8f99; }
  .chev { flex-shrink: 0; margin-left: 6px; font-size: 16px; line-height: 1; color: #c9ccd2; }

  /* Android 系统设置那种开关 */
  .switch {
    position: relative; flex-shrink: 0; width: 48px; height: 28px;
    border-radius: 14px; background: #e5e5ea;
    transition: background .2s ease;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    transition: transform .22s cubic-bezier(.33, 1, .68, 1);
  }
  .switch.on { background: #07c160; }
  .switch.on::after { transform: translateX(20px); }

  /* ---------- 底部弹出选择器（替掉浏览器原生 select） ---------- */
  .sheet-mask {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 900;
    background: rgba(20, 28, 38, .45);
    display: flex; align-items: flex-end;
    animation: maskIn .2s ease both;
  }
  .sheet {
    width: 100%; background: #fff; border-radius: 16px 16px 0 0;
    padding-bottom: 10px;
    animation: sheetUp .28s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-title {
    padding: 15px 16px; text-align: center; font-size: 13px; color: #8a8f99;
    border-bottom: 1px solid #f2f3f5;
  }
  .sheet-list { max-height: 300px; overflow-y: auto; padding: 6px 0; }
  .sheet-item {
    position: relative; padding: 13px 44px; text-align: center;
    font-size: 16px; color: #1a1a1a; cursor: pointer; transition: background .12s;
  }
  .sheet-item:hover { background: #f7f8fa; }
  .sheet-item.on { color: #07a552; font-weight: 600; }
  .sheet-check {
    position: absolute; right: 20px; top: 50%; width: 11px; height: 6px;
    margin-top: -5px; border-left: 2px solid #07c160; border-bottom: 2px solid #07c160;
    transform: rotate(-45deg);
  }

  /* ---------- 时间滚轮（时 / 分 双列） ---------- */
  .tp-wrap {
    position: relative; display: flex; align-items: center; justify-content: center;
    height: 200px; padding: 0 16px;
  }
  .tp-band {
    position: absolute; left: 50%; top: 50%;
    width: 176px; height: 40px; margin: -20px 0 0 -88px;
    background: #f1f8f4; border-radius: 10px;
  }
  .tp-col {
    position: relative; z-index: 1;
    width: 76px; height: 200px;
    padding: 80px 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 32%, #000 68%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 32%, #000 68%, transparent 100%);
  }
  .tp-col::-webkit-scrollbar { display: none; }
  .tp-item {
    height: 40px; line-height: 40px; text-align: center;
    font-size: 21px; color: #1a1a1a;
    font-variant-numeric: tabular-nums;
    scroll-snap-align: center;
  }
  .tp-colon {
    position: relative; z-index: 1;
    width: 18px; text-align: center; font-size: 21px; color: #1a1a1a;
  }
  .tp-ok {
    margin: 4px 16px 6px; padding: 13px; text-align: center;
    font-size: 16px; font-weight: 600; color: #fff;
    background: #07c160; border-radius: 12px; cursor: pointer;
    transition: opacity .15s;
  }
  .tp-ok:hover { opacity: .85; }

  /* ---------- 页面内对话框 ----------
     替掉原生 alert / prompt / confirm —— 预览面板是沙箱 iframe，
     那三个 API 被浏览器禁用，调用会静默失效（按钮点了没反应）。 */
  .dlg-mask {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 1000;
    background: rgba(20, 28, 38, .45);
    display: flex; align-items: center; justify-content: center;
    padding: 0 32px;
    animation: maskIn .2s ease both;
  }
  .dlg {
    width: 100%; max-width: 320px; background: #fff; border-radius: 14px;
    padding: 22px 18px 16px;
    animation: cardPop .3s cubic-bezier(.34,1.4,.64,1) both;
  }
  .dlg-title { text-align: center; font-size: 16px; font-weight: 600; }
  .dlg-text { margin-top: 10px; text-align: center; font-size: 13px; line-height: 1.6; color: #8a8f99; white-space: pre-line; }
  .dlg-input {
    margin-top: 16px; width: 100%; height: 42px; padding: 0 12px; box-sizing: border-box;
    background: #f5f6f8; border: 0; outline: none; border-radius: 9px;
    font-size: 15px; text-align: center; font-family: inherit; color: #1a1a1a;
  }
  .dlg-input::placeholder { color: #c3c7cd; }
  .dlg-err { margin-top: 8px; text-align: center; font-size: 12px; color: #e64340; }

  /* 离线只读提示条 */
  .offline-bar {
    display: flex; align-items: flex-start; gap: 9px;
    margin: 10px 16px 0; padding: 11px 14px;
    background: #fff5e6; border-radius: 12px;
    font-size: 13px; line-height: 1.5; color: #a9670a;
  }
  .offline-dot {
    flex-shrink: 0; width: 8px; height: 8px; margin-top: 5px;
    border-radius: 50%; background: #f0a020;
  }
  .offline-sub { display: block; margin-top: 2px; font-size: 11.5px; color: #c08a3e; }

  /* 未同步（推送失败但还能改）—— 蓝色，不吓人 */
  .offline-bar.info { background: #eef4fd; color: #2f6fb5; }
  .offline-bar.info .offline-dot { background: #378add; }
  .offline-bar.info .offline-sub { color: #6b96c4; }

  /* 只读模式：禁掉所有编辑入口（导航和云备份本身仍可用） */
  body.readonly .task-input,
  body.readonly .check,
  body.readonly .add,
  body.readonly .acct-del,
  body.readonly .row[data-act]:not([data-act^="cloud"]),
  body.readonly .sheet-item,
  body.readonly .tp-ok,
  body.readonly .cal-day {
    pointer-events: none; opacity: .45;
  }

  /* 多字段对话框（云备份配置用） */
  .dlg-field { margin-top: 12px; }
  .dlg-field-label { margin-bottom: 5px; font-size: 12px; color: #8a8f99; text-align: left; }
  .dlg-field .dlg-input { margin-top: 0; text-align: left; font-size: 14px; }

  /* 云备份 / 上传下载图标 */
  .ic-cloud { background: #378add; }
  .ic-up { background: #07c160; }
  .ic-down { background: #f0a020; }
  .s-cloud-a {
    position: absolute; left: 50%; top: 50%; width: 12px; height: 8px;
    margin: -3px 0 0 -6px; background: #fff; border-radius: 4px;
  }
  .s-cloud-b {
    position: absolute; left: 50%; top: 50%; width: 7px; height: 7px;
    margin: -7px 0 0 -6px; background: #fff; border-radius: 50%;
  }
  .s-tri-up {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    margin: -8px 0 0 -5px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-bottom: 7px solid #fff;
  }
  .s-tri-up::after {
    content: ''; position: absolute; left: -1.5px; top: 9px;
    width: 3px; height: 5px; background: #fff; border-radius: 1px;
  }
  .s-tri-down {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    margin: 1px 0 0 -5px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 7px solid #fff;
  }
  .s-tri-down::after {
    content: ''; position: absolute; left: -1.5px; top: -14px;
    width: 3px; height: 5px; background: #fff; border-radius: 1px;
  }
  .dlg-btns { display: flex; gap: 10px; margin-top: 18px; }
  .dlg-btn {
    flex: 1; height: 42px; border-radius: 9px; display: flex; align-items: center;
    justify-content: center; font-size: 15px; cursor: pointer;
    background: #f5f6f8; color: #5f5e5a; transition: background .15s;
  }
  .dlg-btn:hover { background: #eef0f3; }
  .dlg-btn-ok { background: #07c160; color: #fff; }
  .dlg-btn-ok:hover { background: #06ad56; }
  .dlg-btn-danger { background: #e64340; }
  .dlg-btn-danger:hover { background: #d33a37; }

  /* 图标里的白色图形（s- 前缀，避免和底部导航的 g- 类名撞车） */
  .s-ring {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border: 2px solid #fff; border-radius: 50%; box-sizing: border-box;
  }
  .s-hand-v { position: absolute; left: 50%; top: 50%; width: 2px; height: 5px; margin: -5px 0 0 -1px; border-radius: 1px; background: #fff; }
  .s-hand-h { position: absolute; left: 50%; top: 50%; width: 5px; height: 2px; margin: -1px 0 0 0; border-radius: 1px; background: #fff; }
  .s-line { position: absolute; left: 50%; top: 50%; height: 2px; margin-left: -6.5px; border-radius: 1px; background: #fff; }
  .s-l1 { margin-top: -6px; width: 13px; }
  .s-l2 { margin-top: -1px; width: 10px; }
  .s-l3 { margin-top: 4px; width: 7px; }
  .s-card {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 12px; margin: -6px 0 0 -8px;
    border: 2px solid #fff; border-radius: 3px; box-sizing: border-box;
  }
  .s-cal {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 15px; margin: -7.5px 0 0 -8px;
    border: 2px solid #fff; border-radius: 3px; box-sizing: border-box;
  }
  .s-cal-bar { position: absolute; left: 50%; top: 50%; width: 16px; height: 2px; margin: -5.5px 0 0 -8px; background: #fff; }

  .info-row { display: flex; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #f2f3f5; }
  .info-last { border-bottom: none; }
  .info-label { font-size: 14px; color: #8a8f99; }
  .info-value { margin-left: auto; font-size: 14px; }
  .info-strong { font-size: 16px; font-weight: 600; color: #07a552; }

  /* ---------- 第一次进来：起名字 ---------- */
  .greet { margin-bottom: 5px; font-size: 13px; color: #07a552; }
  .name-mask {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 999;
    padding: 0 32px; background: rgba(20, 28, 38, .45);
    display: flex; align-items: center; justify-content: center;
    animation: maskIn .24s ease both;
  }
  .name-card {
    width: 100%; padding: 28px 22px 20px; background: #fff; border-radius: 16px;
    animation: cardPop .38s cubic-bezier(.34,1.4,.64,1) both;
  }
  .name-emoji { position: relative; width: 48px; height: 48px; margin: 0 auto 15px; }
  .ne-circle {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: #07c160;
  }
  .ne-check {
    position: absolute; left: 50%; top: 50%; width: 19px; height: 10px; margin: -5px 0 0 -9.5px;
    border-left: 4px solid #fff; border-bottom: 4px solid #fff; border-radius: 1.5px;
    transform: rotate(-45deg);
  }
  .name-title { text-align: center; font-size: 18px; font-weight: 600; }
  .name-sub { margin-top: 7px; text-align: center; font-size: 12px; line-height: 1.6; color: #8a8f99; }
  .name-input {
    margin-top: 19px; height: 48px; padding: 0 14px; width: 100%;
    background: #f5f6f8; border: 0; outline: none; border-radius: 10px;
    font-size: 15px; text-align: center; font-family: inherit; color: #1a1a1a;
    box-sizing: border-box;
  }
  .name-input::placeholder { color: #c3c7cd; }
  .name-btn {
    margin-top: 14px; height: 46px; border-radius: 10px; background: #07c160; color: #fff;
    font-size: 15.5px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .18s;
  }
  .name-btn:hover { background: #06ad56; }
  .name-btn-off { background: #c8e9d6; }
  .name-skip {
    margin-top: 12px; padding: 6px 0; text-align: center;
    font-size: 13px; color: #a9aeb6; cursor: pointer; transition: color .15s;
  }
  .name-skip:hover { color: #576b95; }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardPop { from { opacity: 0; transform: scale(.9) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* 打卡记录页的日历：按当天状态着色 */

<script>
(function () {
  var KEY = 'daily_three_v1';

     那三个 API 被浏览器禁用，调用会静默返回 null/false（按钮点了没反应）。 */
  function dialogHtml() {
    var d = view.dialog;
    if (!d) return '';
    var h = '<div class="dlg-mask" data-act="dialog-cancel"><div class="dlg">';
    h += '<div class="dlg-title">' + esc(d.title) + '</div>';
    if (d.text) h += '<div class="dlg-text">' + esc(d.text) + '</div>';
    if (d.kind === 'input') {
      h += '<input class="dlg-input" id="dialog-input" maxlength="12" value="' + esc(d.value) +
           '" placeholder="' + esc(d.placeholder) + '">';
    }
    if (d.kind === 'fields') {
      (d.fields || []).forEach(function (f) {
        h += '<div class="dlg-field">';
        h += '<div class="dlg-field-label">' + esc(f.label) + '</div>';
        h += '<input class="dlg-input" data-field="' + esc(f.key) + '" value="' + esc(f.value || '') +
             '" placeholder="' + esc(f.placeholder || '') + '"' +
             (f.password ? ' type="password"' : '') +
             ' autocomplete="off" autocapitalize="off" spellcheck="false">';
        h += '</div>';
      });
    }
    if (view.dialogError) h += '<div class="dlg-err">' + esc(view.dialogError) + '</div>';
    h += '<div class="dlg-btns">';
    if (d.kind !== 'alert') h += '<div class="dlg-btn" data-act="dialog-cancel">取消</div>';
    h += '<div class="dlg-btn ' + (d.danger ? 'dlg-btn-danger' : 'dlg-btn-ok') +
         '" data-act="dialog-ok">' + esc(d.okText) + '</div>';
    h += '</div></div></div>';
    return h;
  }

  function showDialog(opts) {
    view.dialog = {
      kind: opts.kind || 'alert',
      title: opts.title || '提示',
      text: opts.text || '',
      value: opts.value || '',
      placeholder: opts.placeholder || '',
      okText: opts.okText || '确定',
      danger: !!opts.danger,
      action: opts.action || '',
      fields: opts.fields || null,
      payload: opts.payload === undefined ? null : opts.payload
    };
    view.dialogError = '';
    render();
  }

  /** 替代 alert() */
  function alertBox(text, title) {
    showDialog({ kind: 'alert', title: title || '提示', text: text });
  }

  function doDialogOk() {
    var d = view.dialog;
    if (!d) return;

    if (d.kind === 'input') {
      var el = document.getElementById('dialog-input');
      var val = String(el ? el.value : '').trim();
      if (!val) { view.dialogError = '名字不能为空'; render(); return; }
      var res = null;
      if (d.action === 'add-account') res = addAccount(val);
      else if (d.action === 'rename-account') res = renameAccount(d.payload, val);
      if (res && !res.ok) { view.dialogError = res.msg; render(); return; }
    } else if (d.kind === 'fields') {
      var vals = {};
      var ins = document.querySelectorAll('[data-field]');
      for (var fi = 0; fi < ins.length; fi++) {
        vals[ins[fi].getAttribute('data-field')] = String(ins[fi].value || '').trim();
      }
      // 把当前值写回 dialog —— 报错时 render() 会重建输入框，
      // 不写回的话用户刚填的内容会被清空。
      (d.fields || []).forEach(function (f) {
        if (vals[f.key] !== undefined) f.value = vals[f.key];
      });
      if (d.action === 'cloud-config') {
        if (!vals.user) { view.dialogError = '账号不能为空'; render(); return; }
        if (!vals.pass) { view.dialogError = '应用密码不能为空'; render(); return; }
        var prevCfg = window.DailyCloud.readCfg();
        window.DailyCloud.writeCfg({
          user: vals.user, pass: vals.pass,
          lastBackup: prevCfg.lastBackup || 0
        });
      }
    } else if (d.kind === 'confirm') {
      if (d.action === 'delete-account') {
        var r = removeAccount(d.payload);
        if (!r.ok) { alertBox(r.msg); return; }
      } else if (d.action === 'reset-all') {
        doResetAll();
      } else if (d.action === 'cloud-restore-confirm') {
        doCloudRestoreConfirmed();
      } else if (d.action === 'delete-task') {
        removeTaskById(d.payload);
      }
    }

    view.dialog = null;
    view.dialogError = '';
    render();
  }

  /**
   * 统一入口：包一层 .screen 用来播页面过渡。
   * 浮层（对话框 / 底部面板 / 起名弹窗）写到 #overlay，**不放 .screen 里** ——
   * .screen 挂着 transform 动画，会让里面的 position:fixed 相对它定位，滚动后跑偏。
   */
  /* ---------- 云备份事件 ----------
     cloud.js 拉到云端数据 → 覆盖本地并重绘
     cloud.js 状态变化（离线）→ 顶部提示条 + 禁用编辑入口 */
  window.addEventListener('cloud:data', function (e) {
    var res = e.detail || {};
    var c = buildContainer(res.data);
    if (!c) return;
    writeContainer(c);
    render();
  });

  window.addEventListener('cloud:state', function (e) {
    var d = e.detail || {};
    view.cloudOffline = !d.online;
    view.cloudDirty = !!d.dirty;
    view.cloudError = d.error || '';
    document.body.classList.toggle('readonly', !d.online);
    render();
  });

  function renderInto(html, overlayHtml) {
    // 离线 → 只读提示；未同步（推送失败但还能改）→ 蓝色提示，不锁界面
    var bar = '';
    if (view.cloudOffline) {
      bar = '<div class="offline-bar"><div class="offline-dot"></div><div>' +
            '当前离线，只能查看。打卡需要联网。' +
            (view.cloudError ? '<span class="offline-sub">' + esc(view.cloudError) + '</span>' : '') +
            '</div></div>';
    } else if (view.cloudDirty) {
      bar = '<div class="offline-bar info"><div class="offline-dot"></div><div>' +
            '改动还没同步到云端，正在重试…' +
            (view.cloudError ? '<span class="offline-sub">' + esc(view.cloudError) + '</span>' : '') +
            '</div></div>';
    }
    app.innerHTML = '<div class="screen dir-' + navDir + '">' + bar + html + '</div>';
    navDir = 'none';

    var ov = document.getElementById('overlay');
    if (ov) ov.innerHTML = dialogHtml() + (overlayHtml || '');

    var di = document.getElementById('dialog-input');
    if (di) {
      di.focus();
      di.select();
      di.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); doDialogOk(); }
      });
    }
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tipOf(total, done, rest, points) {
    if (!total) return rest ? '假期中，想做就做，不做也不断签' : '先写下今天要做的三件事';
    if (done === total) return rest ? '假期全完成，+ ' + points + ' 假期分' : '今天全部完成，漂亮';
    return '还剩 ' + (total - done) + ' 件没做';
  }

  /* ---------- 今日页 ---------- */
  function renderToday() {
    var data = init();
    var filled = filledTasks(data.tasks);
    var total = filled.length;
    var done = filled.filter(function (t) { return t.done; }).length;
    var percent = total ? Math.round(done / total * 100) : 0;
    var canDelete = data.tasks.length > MIN_TASKS;
    var info = todayInfo(data);

    var allDone = total > 0 && done === total;
    if (allDone && view.prevDone >= 0 && view.prevDone !== done) {
      view.celebrating = true;
      setTimeout(function () {
        view.celebrating = false;
        var c = app.querySelector('.card');
        if (c) c.classList.remove('celebrate');
        var b = app.querySelector('.burst');
        if (b) b.remove();
        var ch = app.querySelector('.chip');
        if (ch) ch.remove();
      }, 1400);
    }
    if (view.prevDone >= 0 && view.prevDone !== done) {
      view.numAnim = true;
      setTimeout(function () {
        view.numAnim = false;
        var el = document.getElementById('prog-num');
        if (el) el.classList.remove('num-anim');
      }, 360);
    }
    view.prevDone = done;

    var html = '';
    html += '<div class="head">';
    if (data.profile.name) html += '<div class="greet">嗨，' + esc(data.profile.name) + '</div>';
    html += '<div class="date">' + labelOf(data.today) + '</div>';
    html += '<div class="weekday">' + weekdayOf(data.today) + '</div>';
    if (isLateNight(data.dayStartHour)) {
      html += '<div class="late-night">已过零点 · 还没到 ' + data.dayStartHour + ' 点，写的任务仍算这一天</div>';
    }
    html += '</div>';

    html += '<div class="card' + (view.celebrating ? ' celebrate' : '') + '">';
    if (info.rest) {
      html += '<div class="rest-banner"><div class="rest-dot"></div><div class="rest-text">' +
              esc(info.restName) + ' · 假期中，不记录也不断签</div></div>';
    }
    if (view.celebrating) {
      html += '<div class="burst">';
      for (var d = 1; d <= 6; d++) html += '<div class="dot dot' + d + '"></div>';
      html += '</div>';
    }
    html += '<div class="progress-row">';
    html += '<div class="progress-num' + (view.numAnim ? ' num-anim' : '') + '" id="prog-num">' + done + '/' + total + '</div>';
    html += '<div class="progress-label">已完成</div>';
    if (view.celebrating) html += '<div class="chip">全部完成</div>';
    html += '</div>';
    html += '<div class="bar"><div class="bar-inner" id="prog-bar" style="width:' + percent + '%"></div></div>';
    html += '<div class="tip" id="prog-tip">' + tipOf(total, done, info.rest, info.points) + '</div>';
    html += '</div>';

    html += '<div class="list">';
    data.tasks.forEach(function (t, i) {
      var cls = 'task';
      if (view.stagger) cls += ' task-stagger';
      if (t.id === view.enteringId) cls += ' task-enter';
      if (t.id === view.leavingId) cls += ' task-leave';
      html += '<div class="' + cls + '" style="animation-delay:' + (view.stagger ? i * 45 : 0) + 'ms">';
      html += '<div class="check' + (t.done ? ' on' : '') + '" data-act="toggle" data-i="' + i + '">' +
              (t.done ? '<div class="tick"></div><div class="ripple"></div>' : '') + '</div>';
      if (t.done) {
        html += '<div class="task-main"><div class="task-text-wrap"><div class="task-text">' + esc(t.text) +
                '</div><div class="strike"></div></div></div>';
      } else {
        html += '<input class="task-input" data-i="' + i + '" value="' + esc(t.text) + '" maxlength="40" placeholder="写一件今天要做的事">';
      }
      // 已完成的任务不给删除按钮 —— 想删先取消勾选
      if (canDelete && !t.done) html += '<div class="del" data-act="del" data-i="' + i + '">×</div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="add" data-act="add">＋ 添加任务</div>';

    var overlay = '';
    if (!data.profile.name && !data.profile.skipped) {
      overlay += '<div class="name-mask"><div class="name-card">';
      overlay += '<div class="name-emoji"><div class="ne-circle"></div><div class="ne-check"></div></div>';
      overlay += '<div class="name-title">给自己起个名字</div>';
      overlay += '<div class="name-sub">只保存在这台设备上，不需要密码，随时可以改。</div>';
      overlay += '<input class="name-input" id="name-input" maxlength="12" placeholder="比如：小明" value="' + esc(view.nameInput || '') + '">';
      overlay += '<div class="name-btn" data-act="save-name">开始</div>';
      overlay += '<div class="name-skip" data-act="skip-name">先跳过，直接用</div>';
      overlay += '</div></div>';
    }

    renderInto(html, overlay);
    bindInputs();
    bindNameInput();

    if (view.toggleIndex !== null) { playToggleAnim(view.toggleIndex); view.toggleIndex = null; }
  }
  function playToggleAnim(index) {
    var rows = app.querySelectorAll('.task');
    var row = rows[index];
    if (!row) return;
    var check = row.querySelector('.check');
    var ripple = row.querySelector('.ripple');
    var strike = row.querySelector('.strike');
    if (check) { void check.offsetWidth; check.classList.add('anim-pop'); }
    if (ripple) ripple.classList.add('anim-ripple');
    if (strike) strike.classList.add('anim-strike');
  }

  function bindInputs() {
    Array.prototype.forEach.call(app.querySelectorAll('input.task-input'), function (input) {
      input.addEventListener('input', function () {
        var i = Number(input.dataset.i);
        var data = load();
        if (!data.tasks[i]) return;
        data.tasks[i].text = input.value;
        save(data);
        updateProgressOnly();
      });
    });
  }

  function bindNameInput() {
    var el = document.getElementById('name-input');
    if (!el) return;
    el.focus();
    el.addEventListener('input', function () { view.nameInput = el.value; });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitName();
    });
  }

  function submitName() {
    var name = String(view.nameInput || '').trim();
    if (!name) { alertBox('先起个名字吧'); return; }
    var d = load();
    setProfileName(d, name);
    save(d);
    view.nameInput = '';
    renderToday();
  }

  /**
   * 删除一条任务（确认之后才走到这里）。
   * 规则：已完成的不许删；位子不能少于最少任务数。
   * 先播 300ms 离场动画，再改数据。
   */
  function removeTaskById(id) {
    var d = load();
    var at = -1;
    d.tasks.forEach(function (t, idx) { if (t.id === id) at = idx; });
    if (at < 0) return;
    if (d.tasks[at].done) {
      alertBox('已完成的任务不能删除。想删的话先取消勾选。', '不能删除');
      return;
    }
    if (d.tasks.length <= MIN_TASKS) return;

    view.leavingId = id;
    renderToday();
    setTimeout(function () {
      var d2 = load();
      var at2 = -1;
      d2.tasks.forEach(function (t, idx) { if (t.id === id) at2 = idx; });
      if (at2 >= 0) d2.tasks.splice(at2, 1);
      d2.tasks = padToMin(d2.tasks);
      save(d2);
      view.leavingId = '';
      renderToday();
    }, 300);
  }

  function updateProgressOnly() {
    var data = load();
    var f = filledTasks(data.tasks);
    var total = f.length;
    var done = f.filter(function (t) { return t.done; }).length;
    var info = todayInfo(data);
    var n = document.getElementById('prog-num');
    var b = document.getElementById('prog-bar');
    var t = document.getElementById('prog-tip');
    if (n) n.textContent = done + '/' + total;
    if (b) b.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    if (t) t.textContent = tipOf(total, done, info.rest, info.points);
  }

  /* ---------- 记录页 ---------- */
  function buildRecord(key, r, candidates, cards) {
    var full = isFull(r);
    var blank = !r.total;
    var badgeText, badgeClass, subText;

    if (r.rest) {
      badgeText = r.restName || '假期';
      badgeClass = 'rest';
      subText = r.total ? '假期里完成了 ' + r.done + '/' + r.total + ' 件' + (r.points ? ' · +' + r.points + ' 分' : '') : '假期，不记录也不断签';
    } else if (full) {
      badgeText = '全勤'; badgeClass = 'full';
      subText = r.done + '/' + r.total + ' 已完成';
    } else if (r.makeup) {
      badgeText = '补签'; badgeClass = 'makeup';
      subText = r.total ? '补签 · 当天完成 ' + r.done + '/' + r.total : '补签 · 当天没有安排任务';
    } else if (blank) {
      badgeText = '空缺'; badgeClass = 'blank';
      subText = '那天没有安排任务';
    } else {
      badgeText = Math.round(r.done / r.total * 100) + '%'; badgeClass = 'part';
      subText = r.done + '/' + r.total + ' 已完成';
    }
    return {
      date: key, label: fullLabelOf(key), badgeText: badgeText, badgeClass: badgeClass,
      subText: subText, dim: blank || r.rest,
      canMakeup: cards > 0 && candidates.indexOf(key) >= 0
    };
  }

  /* ---------- 记录页：日历 + 当天详情 ---------- */
  function cellKind(rec) {
    if (!rec) return 'none';
    if (rec.makeup) return 'makeup';
    if (rec.rest) return 'rest';
    if (isFull(rec)) return 'full';
    if (!rec.total) return 'miss';
    return 'part';
  }

  function buildCalendarHtml(data, year, month, selected) {
    var lead = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push({ blank: true });
    for (var d = 1; d <= daysInMonth; d++) {
      var key = year + '-' + pad(month) + '-' + pad(d);
      var rec = dayRecord(data, key);
      var kind = cellKind(rec);
      cells.push({
        key: key, day: d, blank: false, kind: kind,
        restFull: kind === 'rest' && isFull(rec),
        today: key === data.today,
        future: key > data.today,
        selected: key === selected
      });
    }
    while (cells.length % 7 !== 0) cells.push({ blank: true });

    var html = '';
    html += '<div class="cal-card">';
    html += '<div class="cal-head"><div class="cal-nav" data-act="hist-prev">‹</div>';
    html += '<div class="cal-title">' + year + ' 年 ' + month + ' 月</div>';
    html += '<div class="cal-nav" data-act="hist-next">›</div></div>';
    html += '<div class="cal-week">';
    ['日', '一', '二', '三', '四', '五', '六'].forEach(function (w) {
      html += '<div class="cal-week-cell">' + w + '</div>';
    });
    html += '</div>';
    html += '<div class="cal-grid">';
    cells.forEach(function (c) {
      var cls = 'cal-cell';
      if (c.blank) {
        cls += ' is-blank';
      } else {
        cls += ' k-' + c.kind;
        if (c.today) cls += ' is-today';
        if (c.future) cls += ' is-future';
        if (c.selected) cls += ' is-selected';
        if (c.restFull) cls += ' is-restfull';
      }
      html += '<div class="' + cls + '" data-act="hist-pick" data-key="' + (c.key || '') + '">';
      if (!c.blank) {
        html += '<div class="cal-day"><span>' + c.day + '</span>';
        if (c.today) html += '<div class="today-dot"></div>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="cal-legend">';
    html += '<div class="lg"><div class="lg-dot lg-full"></div><div class="lg-text">全勤</div></div>';
    html += '<div class="lg"><div class="lg-dot lg-part"></div><div class="lg-text">部分</div></div>';
    html += '<div class="lg"><div class="lg-dot lg-miss"></div><div class="lg-text">缺勤</div></div>';
    html += '<div class="lg"><div class="lg-dot lg-rest"></div><div class="lg-text">假期</div></div>';
    html += '<div class="lg"><div class="lg-dot lg-makeup"></div><div class="lg-text">补签</div></div>';
    html += '</div>';
    html += '<div class="cal-note">点日历上的任意一天，下面就会显示那天的记录。</div>';
    html += '</div>';
    return html;
  }

  function buildDetailHtml(data, key, candidates, cards) {
    var rec = dayRecord(data, key);
    var html = '<div class="detail-card">';
    html += '<div class="detail-head"><div class="detail-date">' + fullLabelOf(key) + '</div>';

    if (!rec) {
      html += '</div><div class="detail-empty">' + (key > data.today ? '这天还没到' : '这天还没有记录') + '</div></div>';
      return html;
    }

    var full = isFull(rec);
    var statusText = '', statusClass = 'part';
    if (rec.makeup) { statusText = '补签'; statusClass = 'makeup'; }
    else if (rec.rest) { statusText = rec.restName || '假期'; statusClass = 'rest'; }
    else if (full) { statusText = '全勤'; statusClass = 'full'; }
    else if (!rec.total) { statusText = '缺勤'; statusClass = 'miss'; }
    else { statusText = Math.round(rec.done / rec.total * 100) + '%'; statusClass = 'part'; }

    html += '<div class="detail-status st-' + statusClass + '">' + statusText + '</div></div>';

    html += '<div class="detail-label">那天做了什么</div>';
    var tasks = rec.tasks || [];
    if (!tasks.length) {
      html += '<div class="detail-empty">' + (key === data.today ? '今天还没安排任务' : '那天没有安排任务') + '</div>';
    } else {
      tasks.forEach(function (t) {
        html += '<div class="dtask"><div class="dtask-mark' + (t.done ? ' on' : '') + '"></div>';
        html += '<div class="dtask-text' + (t.done ? ' done' : '') + '">' + esc(t.text) + '</div></div>';
      });
    }

    html += '<div class="detail-label">那天拿到了什么</div>';
    var rewards = [];
    if (full) rewards.push({ text: '全勤 +1 天', kind: 'full' });
    if (rec.points > 0) rewards.push({ text: '假期分 +' + rec.points, kind: 'points' });
    if (rec.makeup) rewards.push({ text: '补签 -1 张', kind: 'makeup' });
    if (rec.rest && !full) rewards.push({ text: '假期，不算缺勤', kind: 'rest' });

    if (!rewards.length) {
      html += '<div class="detail-empty">这天没有奖励</div>';
    } else {
      html += '<div class="reward-row">';
      rewards.forEach(function (r) {
        html += '<div class="reward rw-' + r.kind + '">' + r.text + '</div>';
      });
      html += '</div>';
    }

    if (cards > 0 && candidates.indexOf(key) >= 0) {
      html += '<div class="makeup-btn" data-act="makeup" data-date="' + key + '">用 1 张补签卡补回这天</div>';
    }

    html += '</div>';
    return html;
  }

  function renderHistory() {
    var data = init();
    var s = derived(data);
    var candidates = makeupCandidates(data);

    if (!view.histYear) {
      var t0 = parseKey(data.today);
      view.histYear = t0.getFullYear();
      view.histMonth = t0.getMonth() + 1;
    }
    if (!view.selected) view.selected = data.today;

    var html = '';
    html += buildCalendarHtml(data, view.histYear, view.histMonth, view.selected);
    html += buildDetailHtml(data, view.selected, candidates, data.makeupCards);

    html += '<div class="stat-card">';
    html += '<div class="stat"><div class="stat-num">0</div><div class="stat-label">连续打卡</div></div>';
    html += '<div class="divider"></div>';
    html += '<div class="stat"><div class="stat-num">0</div><div class="stat-label">累计全勤</div></div>';
    html += '<div class="divider"></div>';
    html += '<div class="stat"><div class="stat-num">0</div><div class="stat-label">最长连续</div></div>';
    html += '</div>';

    html += '<div class="divider"></div>';

    html += '<div class="divider"></div>';

    html += '</div>';

    html += '<div class="summary">累计记录 ' + s.recordedDays + ' 天 · 完成 ' + s.doneTasks + '/' + s.totalTasks + ' 件' +
            (s.restDays ? ' · 假期 ' + s.restDays + ' 天' : '') +
            (s.makeupDays ? ' · 补签 ' + s.makeupDays + ' 天' : '') + '</div>';

    var achGroups = Object.keys(MILESTONES).map(function (type) {
      var current = s[type];
      var levels = MILESTONES[type];
      var unit = type === 'holidayPoints' ? '分' : '天';
      var next = null, unlockedHere = 0;
      var items = levels.map(function (m) {
        var done = current >= m;
        if (done) unlockedHere++;
        if (!done && next === null) next = m;
        return { value: m, state: done ? 'done' : (m === next ? 'next' : '') };
      });
      return {
        label: MILESTONE_LABEL[type], current: current, unit: unit,
        unlockedHere: unlockedHere, totalHere: levels.length,
        nextText: next === null ? '这一组已经全部解锁' : '下一个 ' + next + ' ' + unit + ' · 还差 ' + (next - current) + ' ' + unit,
        items: items
      };
    });
    var achUnlocked = 0, achTotal = 0;
    achGroups.forEach(function (g) { achUnlocked += g.unlockedHere; achTotal += g.totalHere; });

    html += '<div class="section-title"><span>成就</span><span class="section-extra">已解锁 ' + achUnlocked + ' / ' + achTotal + '</span></div>';
    html += '<div class="ach-card">';
    html += '<div class="ach-hint">攒到档位就点亮一个，永久记录，不会因为断签丢掉。</div>';
    achGroups.forEach(function (g) {
      html += '<div class="ach-row"><div class="ach-head">';
      html += '<div class="ach-label">' + g.label + '</div>';
      html += '<div class="ach-current">' + g.current + '<span class="ach-unit">' + g.unit + '</span></div></div>';
      html += '<div class="ach-next">' + g.nextText + '</div>';
      html += '<div class="ach-chips">';
      g.items.forEach(function (it) {
        html += '<div class="ach-chip ' + it.state + '">' + it.value + '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';

    renderInto(html);
    countUp(s);
  }

  function countUp(target) {
    var nums = app.querySelectorAll('.stat-num');
    var steps = 20, i = 0;
    function tick() {
      i++;
      var eased = 1 - Math.pow(1 - i / steps, 3);
      if (nums[0]) nums[0].textContent = Math.round(target.streak * eased);
      if (nums[1]) nums[1].textContent = Math.round(target.totalFull * eased);
      if (nums[2]) nums[2].textContent = Math.round(target.longestStreak * eased);
      if (nums[3]) nums[3].textContent = Math.round(target.holidayPoints * eased);
      if (i < steps) setTimeout(tick, 26);
    }
    tick();
  }

  /* ---------- 假期设置页 ---------- */
  function buildCells(year, month, custom, form, today) {
    var lead = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push({ idx: 'lead' + i, blank: true });
    for (var d = 1; d <= daysInMonth; d++) {
      var key = year + '-' + pad(month) + '-' + pad(d);
      var h = holidayFind(key, custom);
      cells.push({
        idx: key, key: key, day: d, blank: false,
        kind: h ? (h.builtIn ? 'builtin' : 'custom') : 'normal',
        today: key === today,
        past: key < today,
        selected: !!(form.start && form.end && key >= form.start && key <= form.end)
      });
    }
    while (cells.length % 7 !== 0) cells.push({ idx: 'tail' + cells.length, blank: true });
    return cells;
  }

  function openSheet(kind) {
    var d = load();
    var options = [];
    var title = '';
    var selected = 0;
    var i;

    if (kind === 'hour') {
      title = '每日结算时间';
      selected = d.dayStartHour;
      for (i = 0; i < 24; i++) options.push({ value: i, label: i + ' 点' });
    } else if (kind === 'min') {
      title = '任务栏最少几个';
      selected = d.minTasks;
      for (i = 1; i <= 10; i++) options.push({ value: i, label: i + ' 个' });
    } else if (kind === 'rtarget') {
      title = '提醒哪一件';
      var rmG = d.reminder || {};
      selected = (rmG.target === undefined || rmG.target === 'all') ? -1 : Number(rmG.target);
      options.push({ value: -1, label: '全部（只说还差几件）' });
      for (i = 0; i < 3; i++) options.push({ value: i, label: '第 ' + (i + 1) + ' 件' });
    } else {
      title = '补签卡最多存几张';
      selected = d.maxCards;
      for (i = 1; i <= 10; i++) options.push({ value: i, label: i + ' 张' });
    }

    view.sheet = { kind: kind, title: title, options: options, selected: selected };
    render();
  }

  /** 设置改了之后，让 App 里的通知重新排一次（网页版没有这个对象，直接跳过） */
  function refreshNotification() {
    if (!window.DailyNotify || typeof window.DailyNotify.refresh !== 'function') return;
    try {
      var d = load();
      var rm = d.reminder || {};
      if (!rm.enabled) {
        if (typeof window.DailyNotify.cancel === 'function') window.DailyNotify.cancel();
        return;
      }
      var parts = String(rm.time || '22:30').split(':');
      window.DailyNotify.refresh({ hour: Number(parts[0]), minute: Number(parts[1]) });
    } catch (e) {
      console.warn('[reminder] 刷新通知失败', e);
    }
  }

    var d = load();
    var t = String((d.reminder && d.reminder.time) || '22:30').split(':');
    var hh = Number(t[0]), mi = Number(t[1]);
    view.sheet = {
      kind: 'time',

      minute: isFinite(mi) ? Math.max(0, Math.min(59, mi)) : 30

    // 等 DOM 出来再滚到当前值
    setTimeout(function () {
      if (!view.sheet || view.sheet.kind !== 'time') return;
      var hc = document.getElementById('tp-h');
      var mc = document.getElementById('tp-m');
      if (hc) hc.scrollTop = view.sheet.hour * 40;
      if (mc) mc.scrollTop = view.sheet.minute * 40;
    }, 30);
  }

  /** "3 分钟前" 这种人话时间 */
  function agoText(ts) {
    var gap = Date.now() - ts;
    if (gap < 60000) return '刚刚';
    if (gap < 3600000) return Math.floor(gap / 60000) + ' 分钟前';
    if (gap < 86400000) return Math.floor(gap / 3600000) + ' 小时前';
    var d = new Date(ts);
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }

    return !!(window.DailyCloud && window.DailyCloud.isConfigured && window.DailyCloud.isConfigured());
  }

  function openCloudConfig() {
    if (!window.DailyCloud) {
      alertBox('云备份只在 App 版里能用。网页预览版连不上 WebDAV（跨域会被拦）。', '云备份');
      return;
    }
    var c = window.DailyCloud.readCfg();
    showDialog({
      kind: 'fields',
      title: '云备份设置',
      text: '坚果云 App → 设置 → 第三方应用管理 → 添加应用密码。地址会自动生成，不用填。',
      fields: [
        { key: 'user', label: '坚果云账号', value: c.user || '',
          placeholder: '邮箱' },
        { key: 'pass', label: '应用密码', value: c.pass || '',
          placeholder: '不是登录密码', password: true }
      ],
      okText: '保存',
      action: 'cloud-config'
    });
  }

  function doCloudBackup() {
    if (!cloudReady() || view.cloudBusy) return;
    var raw = readRaw();
    if (!raw) { alertBox('本地还没有数据'); return; }
    view.cloudBusy = 'backup';
    render();
    window.DailyCloud.backup(raw).then(function (r) {
      view.cloudBusy = '';
      render();
      var msg = '已备份到云端（' + (r.bytes / 1024).toFixed(0) + ' KB）';
      if (r.path) msg += '\n\n存放位置：' + r.path;
      alertBox(msg, '备份成功');
    }).catch(function (e) {
      view.cloudBusy = '';
      render();
      alertBox(e.message || '备份失败', '备份失败');
    });
  }

  function doCloudRestore() {
    if (!cloudReady() || view.cloudBusy) return;
    showDialog({
      kind: 'confirm',
      title: '从云端恢复',
      text: '会用云端那份覆盖这台设备上的全部数据，包括所有账号。本地的改动会丢失。',
      okText: '覆盖本地',
      danger: true,
      action: 'cloud-restore-confirm'
    });
  }

  function doCloudRestoreConfirmed() {
    view.cloudBusy = 'restore';
    render();
    window.DailyCloud.restore().then(function (res) {
      var c = buildContainer(res && res.data);
      if (!c) throw new Error('云端数据里没有账号');
      writeContainer(c);
      view.cloudBusy = '';
      render();
      alertBox('已从云端恢复', '恢复成功');
    }).catch(function (e) {
      view.cloudBusy = '';
      render();
      alertBox(e.message || '恢复失败', '恢复失败');
    });
  }

  function applyOption(kind, raw) {
    var d = load();
    var value = Number(raw);

    if (kind === 'rtarget') {
      d.reminder.target = value < 0 ? 'all' : value;
      save(d);
      refreshNotification();
      return;
    }

    if (kind === 'hour') setDayStartHour(d, value);
    else if (kind === 'min') setMinTasks(d, value);
    else if (kind === 'cards') setMaxCards(d, value);
    save(d);
  }

  /* ---------- 事件 ---------- */
  // 监听整个文档：浮层（对话框 / 底部面板 / 起名弹窗）现在挂在 #overlay 下，
  // 不在 #app 里 —— 只监听 #app 会收不到它们的点击。
  // 时间滚轮：滚动时只记位置，不重渲染（重渲染会打断滚动）
  // scroll 事件不冒泡，所以用捕获阶段监听
  document.addEventListener('scroll', function (e) {
    var el = e.target;
    if (!el || !el.id || (el.id !== 'tp-h' && el.id !== 'tp-m')) return;
    if (!view.sheet || view.sheet.kind !== 'time') return;
    var idx = Math.round(el.scrollTop / 40);
    if (el.id === 'tp-h') view.sheet.hour = Math.max(0, Math.min(23, idx));
    else view.sheet.minute = Math.max(0, Math.min(59, idx));
  }, true);

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    var i = Number(el.dataset.i);
    var data = load();

    if (act === 'toggle') {
      var task = data.tasks[i];
      if (!task || !task.text || !task.text.trim()) return;
      task.done = !task.done;
      save(data);
      view.toggleIndex = i;
      renderToday();
    } else if (act === 'add') {
      var fresh = blankTask();
      data.tasks.push(fresh);
      save(data);
      view.enteringId = fresh.id;
      renderToday();
      setTimeout(function () {
        if (view.enteringId === fresh.id) {
          view.enteringId = '';
          var rows = app.querySelectorAll('.task');
          var last = rows[rows.length - 1];
          if (last) last.classList.remove('task-enter');
        }
      }, 520);
    } else if (act === 'del') {
      if (data.tasks.length <= MIN_TASKS) return;
      var delTask = data.tasks[i];
      if (!delTask || delTask.done) return;
      var delText = String(delTask.text || '').trim();
      if (!delText) return;
      showDialog({
        kind: 'confirm',
        title: '删除任务',
        text: '确定删除「' + delText + '」吗？删掉后今天就少这一条记录了。',
        okText: '删除',
        danger: true,
        action: 'delete-task',
        payload: delTask.id
      });
    } else if (act === 'history') {
      view.screen = 'history';
      navDir = 'forward';
      staggerOnce();
      renderHistory();
    } else if (act === 'holiday') {
      view.screen = 'holiday';
      navDir = 'forward';
      view.form = { name: '', start: '', end: '' };
      view.formTouched = false;
      renderHoliday();
    } else if (act === 'back') {
      view.screen = 'today';
      navDir = 'back';
      renderToday();
    } else if (act === 'settings') {
      view.screen = 'settings';
      navDir = 'forward';
      renderSettings();
    } else if (act === 'save-name') {
      submitName();
    } else if (act === 'skip-name') {
      var ds = load();
      skipProfileName(ds);
      save(ds);
      view.nameInput = '';
      renderToday();
    } else if (act === 'account-tap') {
      var aid = el.dataset.id;
      var acc = listAccounts().filter(function (x) { return x.id === aid; })[0];
      if (!acc) return;
      if (acc.active) {
        showDialog({
          kind: 'input', title: '修改名字', value: acc.rawName,
          placeholder: '输入名字', action: 'rename-account', payload: aid
        });
        return;
      }
      switchAccount(aid);
      view.sheet = null;
      render();
    } else if (act === 'account-add') {
      showDialog({
        kind: 'input', title: '新账号的名字',
        placeholder: '比如：工作 / 个人', action: 'add-account'
      });
    } else if (act === 'account-del') {
      showDialog({
        kind: 'confirm', title: '删除账号',
        text: '这个账号的任务、历史、假期和成就都会一起删除，无法恢复。',
        okText: '删除', danger: true, action: 'delete-account', payload: el.dataset.id
      });
    } else if (act === 'dialog-ok') {
      doDialogOk();
    } else if (act === 'dialog-cancel') {
      // 点遮罩关、点「取消」按钮也关；点对话框里的空白处不关。
      // 注意：取消按钮本身就在 .dlg 里，只判断 closest('.dlg') 会把按钮也挡掉。
      var inCard = e.target.closest('.dlg');
      var onBtn = e.target.closest('.dlg-btn');
      if (inCard && !onBtn) return;
      view.dialog = null;
      view.dialogError = '';
      render();
    } else if (act === 'open-sheet') {
      openSheet(el.dataset.kind);
    } else if (act === 'pick-opt') {
      // 传原始字符串：提醒时间要 "22:30" 这种，不能强转成数字
      applyOption(view.sheet ? view.sheet.kind : '', el.dataset.value);
      view.sheet = null;
      render();
    } else if (act === 'cloud-config') {
      openCloudConfig();
    } else if (act === 'cloud-backup') {
      doCloudBackup();
    } else if (act === 'cloud-restore') {
      doCloudRestore();
    } else if (act === 'open-time') {
      openTimePicker();
    } else if (act === 'time-ok') {
      var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
      var dT = load();
      dT.reminder.time = p2(view.sheet.hour) + ':' + p2(view.sheet.minute);
      save(dT);
      view.sheet = null;
      refreshNotification();
      render();
    } else if (act === 'toggle-reminder') {
      var dR = load();
      dR.reminder.enabled = !dR.reminder.enabled;
      save(dR);
      refreshNotification();
      render();
    } else if (act === 'close-sheet') {
      // 点面板内部不关，点遮罩才关
      if (e.target.closest('.sheet')) return;
      view.sheet = null;
      render();
    } else if (act === 'holiday-back') {
      view.screen = 'settings';
      navDir = 'back';
      render();
    } else if (act === 'hist-prev') {
      var hy = view.histYear, hm = view.histMonth - 1;
      if (hm < 1) { hm = 12; hy -= 1; }
      view.histYear = hy; view.histMonth = hm;
      renderHistory();
    } else if (act === 'hist-next') {
      var hy2 = view.histYear, hm2 = view.histMonth + 1;
      if (hm2 > 12) { hm2 = 1; hy2 += 1; }
      view.histYear = hy2; view.histMonth = hm2;
      renderHistory();
    } else if (act === 'hist-pick') {
      var pickedDay = el.dataset.key;
      if (!pickedDay || pickedDay === view.selected) return;
      view.selected = pickedDay;
      renderHistory();
    } else if (act === 'prev-month') {
      var py = view.calYear, pm = view.calMonth - 1;
      if (pm < 1) { pm = 12; py -= 1; }
      view.calYear = py; view.calMonth = pm;
      renderHoliday();
    } else if (act === 'next-month') {
      var ny = view.calYear, nm = view.calMonth + 1;
      if (nm > 12) { nm = 1; ny += 1; }
      view.calYear = ny; view.calMonth = nm;
      renderHoliday();
    } else if (act === 'pick-day') {
      var picked = el.dataset.key;
      if (!picked) return;
      if (picked < nowKey()) {
        alertBox('不能选过去的日期');
        return;
      }
      var ff = view.form;
      if (!view.formTouched) {
        // 表单默认是"今天~今天"，那只是占位，第一次点日历应该是一次全新的选择
        ff.start = picked; ff.end = picked;
        view.formTouched = true;
      } else if (ff.start && ff.end && picked > ff.start && picked < ff.end) {
        ff.start = picked; ff.end = picked;
      } else if (ff.start && ff.end && picked > ff.end) {
        ff.end = picked;
      } else if (ff.start && ff.end && picked < ff.start) {
        ff.start = picked;
      } else {
        ff.start = picked; ff.end = picked;
      }
      renderHoliday();
    } else if (act === 'makeup') {
      var key = el.dataset.date;
      var d2 = load();
      var res = makeup(d2, key);
      if (!res.ok) { alertBox(res.msg); return; }
      save(d2);
      staggerOnce();
      renderHistory();
    } else if (act === 'add-holiday') {
      var d3 = load();
      var f = view.form;
      if (!f.start || !f.end) { alertBox('请选择起止日期'); return; }
      if (f.start > f.end) { alertBox('结束日期不能早于开始'); return; }
      if (f.start < d3.today) { alertBox('只能标记今天及以后'); return; }
      d3.customHolidays.push({
        id: 'h' + newId(),
        name: (f.name || '').trim().slice(0, 8) || '假期',
        start: f.start, end: f.end, createdAt: Date.now()
      });
      d3.customHolidays.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
      save(d3);
      view.form = { name: '', start: d3.today, end: d3.today };
      view.formTouched = false;
      renderHoliday();
    } else if (act === 'del-holiday') {
      var hid = el.dataset.id;
      var d4 = load();
      d4.customHolidays = d4.customHolidays.filter(function (h) { return h.id !== hid; });
      save(d4);
      renderHoliday();
    }
  });

  function staggerOnce() {
    view.stagger = true;
    setTimeout(function () {
      view.stagger = false;
      Array.prototype.forEach.call(app.querySelectorAll('.task-stagger'), function (el) {
        el.classList.remove('task-stagger');
        el.style.animationDelay = '';
      });
    }, 760);
  }

  /* ---------- 底部导航 ---------- */
  var TAB_ORDER = { today: 0, history: 1, settings: 2 };

  /** 假期设置是从设置里进去的，所以高亮"设置" */
  function activeTab() {
    return view.screen === 'holiday' ? 'settings' : view.screen;
  }

  function updateTabbar() {
    var active = activeTab();
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar .tab'), function (el) {
      el.classList.toggle('on', el.dataset.tab === active);
    });
  }

  function render() {
    if (view.screen === 'history') renderHistory();
    else if (view.screen === 'settings') renderSettings();
    else if (view.screen === 'holiday') renderHoliday();
    else renderToday();
    updateTabbar();
  }

  document.getElementById('tabbar').addEventListener('click', function (e) {
    var el = e.target.closest('.tab');
    if (!el) return;
    var tab = el.dataset.tab;
    var from = activeTab();

    if (tab === from) {
      // 已经在这个 tab 上：如果正停在假期设置页，就退回设置
      if (view.screen === 'holiday') {
        view.screen = 'settings';
        navDir = 'back';
        render();
      }
      return;
    }

    navDir = TAB_ORDER[tab] > TAB_ORDER[from] ? 'forward' : 'back';
    view.screen = tab;
    if (tab === 'history') staggerOnce();
    render();
  });

  document.getElementById('btnNextDay').addEventListener('click', function () {
    setOffset(clockOffset + 1);
    init();
    view.screen = 'today';
    view.prevDone = -1;
    staggerOnce();
    render();
  });

  function doResetAll() {
    setOffset(0);
    clockHourShift = 0;
    var nb = document.getElementById('btnNight');
    if (nb) nb.textContent = '模拟凌晨 2 点';
    try { localStorage.removeItem(KEY); } catch (e) {}
    init();
    view.screen = 'today';
    view.prevDone = -1;
    view.form = { name: '', start: '', end: '' };
    view.formTouched = false;
    staggerOnce();
  }

  document.getElementById('btnReset').addEventListener('click', function () {
    showDialog({
      kind: 'confirm', title: '清空全部数据',
      text: '任务、历史、假期、成就都会删除，无法恢复。',
      okText: '清空', danger: true, action: 'reset-all'
    });
  });

  // 把"现在"挪到凌晨 2 点，用来验证结算时间的行为
  document.getElementById('btnNight').addEventListener('click', function () {
    var btn = this;
    if (clockHourShift === 0) {
      clockHourShift = 2 - new Date().getHours();
      btn.textContent = '恢复真实时间';
    } else {
      clockHourShift = 0;
      btn.textContent = '模拟凌晨 2 点';
    }
    // 只重算逻辑日期，不动任务数据
    var d = load();
    d.today = nowKey(d.dayStartHour);
    save(d);
    view.screen = 'today';
    view.prevDone = -1;
    render();
  });

  app.classList.add('intro');
  setTimeout(function () { app.classList.remove('intro'); }, 700);
  staggerOnce();
  render();
})();
</script>
</body>
</html>
