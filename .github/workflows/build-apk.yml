name: 打包 APK

# 什么时候跑：
#   - 改了 app/ 或 webapp/ 的代码
#   - 改了 reminder.js（通知文案）
#   - 手动点按钮触发
on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'webapp/**'
      - 'miniprogram/utils/reminder.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    # 锁死 24.04：ubuntu-latest 从 2026-10-19 开始迁到 Ubuntu 26，
    # 迁移期镜像不稳定，先钉住已知能用的版本。
    runs-on: ubuntu-24.04

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 装 Java 21（Capacitor 8 要求）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像自带 Android SDK，不需要 setup-android 这个 action。
      # 只需要补装 compileSdk 36 对应的平台，并接受许可。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 路径: $SDK"
          echo "已有的 platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "已有的 build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5 || true
          else
            echo "没找到 sdkmanager，交给 Gradle 自动下载"
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: 装依赖
        working-directory: app
        run: npm ci

      - name: 生成 www（从 webapp 复制网页 + 打包 reminder.js）
        working-directory: app
        run: node scripts/prepare-www.js

      - name: 同步到 Android 工程
        working-directory: app
        run: npx cap sync android

      - name: 编译 APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-three-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
