name: 打包 APK

# 什么时候跑：
#   - 改了 app/ 或 webapp/ 的代码
#   - 改了 reminder.js（通知文案）
#   - 手动点按钮触发
on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'webapp/**'
      - 'miniprogram/utils/reminder.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    # 锁死 24.04：ubuntu-latest 从 2026-10-19 开始迁到 Ubuntu 26，
    # 迁移期镜像不稳定，先钉住已知能用的版本。
    runs-on: ubuntu-24.04

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 装 Java 21（Capacitor 8 要求）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像自带 Android SDK，不需要 setup-android 这个 action。
      # 只需要补装 compileSdk 36 对应的平台，并接受许可。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 路径: $SDK"
          echo "已有的 platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "已有的 build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5 || true
          else
            echo "没找到 sdkmanager，交给 Gradle 自动下载"
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: 装依赖
        working-directory: app
        run: npm ci

      - name: 生成 www（从 webapp 复制网页 + 打包 reminder.js）
        working-directory: app
        run: node scripts/prepare-www.js

      - name: 同步到 Android 工程
        working-directory: app
        run: npx cap sync android

      # 用固定的 keystore 签名，这样每次编译出来的 APK 签名一致，
      # 手机上覆盖安装才不会报"签名不一致"。
      # 容错：Secret 没配 / base64 贴坏 / 解出来不是合法 PKCS12 时，
      # 自动删掉 keystore 退回默认 debug 签名，保证编译不会因此失败。
      - name: 还原签名 keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > app/android/app/release.keystore 2>/dev/null || true
          SIZE=$(stat -c%s app/android/app/release.keystore 2>/dev/null || echo 0)
          echo "keystore 大小: $SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::warning::keystore 解出来只有 $SIZE 字节，不是合法文件，这次用默认签名"
            rm -f app/android/app/release.keystore
          fi

      - name: 编译 APK
        working-directory: app/android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 改个能直接装的名字
        working-directory: app/android/app/build/outputs/apk/debug
        run: |
          ls -la
          cp app-debug.apk daily-three.apk

      # Actions 的产物（artifact）即使公开仓库也要登录才能下，
      # 而 Release 的资源是公开直链，curl 就能拉，也不会 90 天过期。
      - name: 发布到 Release（公开可下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            自动构建，来自提交 `${{ github.sha }}`
            分支：`${{ github.ref_name }}`

            安装：下载 `daily-three.apk`，传到手机，允许「未知来源」即可。
          files: app/android/app/build/outputs/apk/debug/daily-three.apk
          prerelease: true
          make_latest: false

      - name: 上传 APK（构建产物，需要登录下载）
        uses: actions/upload-artifact@v4
        with:
          name: daily-three-apk
          path: app/android/app/build/outputs/apk/debug/daily-three.apk
          if-no-files-found: error
          retention-days: 90
